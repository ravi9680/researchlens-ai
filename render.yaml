# One-click Render deploy: https://dashboard.render.com/blueprint
# (connect your GitHub repo containing this file, Render does the rest)
services:
  - type: web
    name: researchlens
    runtime: node
    plan: free
    buildCommand: >-
      make -C algorithm_engine &&
      npm --prefix backend install --include=dev &&
      npm --prefix frontend install --include=dev &&
      npm --prefix backend run migrate &&
      npm --prefix backend run seed &&
      npm --prefix frontend run build
    startCommand: npm --prefix backend run start
    envVars:
      - key: NODE_ENV
        value: "production"
      - key: DEMO_MODE
        value: "true"
      - key: EMBEDDING_PROVIDER
        value: local
      - key: TOKEN_TTL
        value: 2h
      - key: REFRESH_TOKEN_TTL
        value: 30d
      - key: BCRYPT_ROUNDS
        value: "12"
      # A random secret per deploy. It is hashed with SHA-256 before use as
      # the HMAC key, so any length yields a full 256-bit key. The server
      # refuses to start in production if this is missing or left at the
      # development default.
      - key: JWT_SECRET
        generateValue: true
# IMPORTANT: the install steps use `--include=dev` on purpose.
# This service runs with NODE_ENV=production, and npm omits devDependencies
# whenever that is set — which would leave `tsx` (the TypeScript runner used
# by migrate/seed) and `vite` (the frontend bundler) uninstalled and the
# build would fail with "tsx: not found". `--include=dev` forces them back in
# for the build step while the runtime itself still runs production-only code.
#
# NOTE (free tier): filesystem is ephemeral — uploaded papers and the SQLite
# DB reset on restart/redeploy (demo seed re-runs each deploy, so the app
# always boots with data). For persistence use Render Postgres + the DDL in
# backend/migrations/postgres.sql (see docs/DATABASE.md portability notes).
